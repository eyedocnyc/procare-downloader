name: Build apps

# Run manually from the Actions tab, or automatically when you push a version
# tag like v1.0 (which also publishes a Release with downloadable files).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the Release on a tag

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (M-series): fast, reliable runners.
        # The binary runs on Apple Silicon Macs (2020+); not Intel Macs.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller requests piexif

      - name: Run tests
        run: python tests/test_core.py

      # On a version tag, the baked-in APP_VERSION must match the tag, or the
      # self-updater would misreport the app's version. Fail the release build if
      # they drift. (Runs only for tag pushes; manual/dispatch builds skip it.)
      - name: Check APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version=$(python -c "import procare_download as p; print(p.APP_VERSION)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$app_version  tag=$tag_version"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::APP_VERSION ($app_version) does not match tag ($tag_version). Bump APP_VERSION in procare_download.py."
            exit 1
          fi

      - name: Build the app
        run: >
          pyinstaller --onefile --windowed --name ProcareDownloader
          --hidden-import scrapbook --hidden-import updater --hidden-import gui --hidden-import piexif
          --noconfirm procare_download.py

      # Catches "Tk itself won't bundle/init" packaging breakage (missing Tcl/Tk
      # libs etc.) before it reaches users -- launch the built binary, confirm it
      # starts without an immediate crash, then kill it. This can't catch visual
      # issues, only outright failure to construct a Tk root.
      - name: Smoke-test the built app opens a window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ProcareDownloader.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            Write-Error "ProcareDownloader.exe exited immediately (exit code $($p.ExitCode)) -- packaging is likely broken."
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Smoke-test the built app opens a window (macOS)
        if: runner.os == 'macOS'
        run: |
          open dist/ProcareDownloader
          sleep 3
          if ! pgrep -f dist/ProcareDownloader > /dev/null; then
            echo "::error::ProcareDownloader exited immediately -- packaging is likely broken."
            exit 1
          fi
          pkill -f dist/ProcareDownloader

      - name: Package into a shareable zip
        run: python package_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcareDownloader-${{ runner.os }}
          path: dist/ProcareDownloader-*.zip*

  # Publish the Release exactly ONCE, after both OS builds. Doing this inside the
  # build matrix ran action-gh-release twice (once per OS) against the same tag,
  # and its generate_release_notes appended a second "What's Changed" block each
  # time — hence the duplicated notes. A single release job with both artifacts
  # avoids that (and the race between the two matrix jobs creating the release).
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download both OS build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist   # each artifact lands in dist/<artifact-name>/

      - name: Publish Release with notes + files
        uses: softprops/action-gh-release@v2
        with:
          # Let GitHub write the body ("What's Changed" from merged PRs) instead of
          # the tagged commit's raw message (a squash-merge commit would otherwise
          # leak its concatenated bodies + trailers into the notes).
          generate_release_notes: true
          files: dist/**/ProcareDownloader-*.zip*
