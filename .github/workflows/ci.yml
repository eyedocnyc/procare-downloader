name: CI

# Fast checks on every PR and push to main: compile + the regression tests.
# (Release binaries are built separately by build.yml, only on version tags.)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on both supported Pythons, plus Windows (where the release build
        # also runs the tests) so platform-specific failures surface at PR time.
        include:
          - {os: ubuntu-latest, python-version: '3.9'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: windows-latest, python-version: '3.12'}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all modules
        run: python -m compileall procare_download.py scrapbook.py updater.py gui.py package_app.py tests

      - name: Run regression tests
        run: python tests/test_core.py
