[project]
name = "procare-downloader"
# Placeholder: PEP 621 requires this field, but nothing is ever built from this
# file (see [tool.uv] package = false), so it is never published or installed.
# The real version is APP_VERSION in procare_download.py -- the self-updater and
# the release drift-guard both read that one. Keeping a second real version
# string here would only give it something to drift against.
version = "0.0.0"
description = "Download every Procare photo/video and build a browsable HTML scrapbook."
readme = "README.md"
license = { file = "LICENSE" }
# 3.9 is the floor CI tests against, and what ships on older macOS/Windows
# Pythons that end users are likely to already have. Don't raise it without
# also updating .github/workflows/ci.yml.
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "piexif>=1.1.3",
]

[dependency-groups]
# Dev-only. End users never install these: the shipped app is a PyInstaller
# binary, and the "START HERE" launchers pip-install requirements.txt instead.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "pyinstaller>=6.0",
]

[tool.uv]
# Plain top-level modules, not an installable package -- `uv sync` should only
# materialize the dependencies into .venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports the engine modules from the repo root.
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# UP rewrites that need >=3.10 (PEP 604 unions etc.) are already gated by
# target-version, so UP stays on.
ignore = [
    "E501",    # long lines are the formatter's call, not a lint failure
    "SIM105",  # contextlib.suppress reads worse than try/except pass here
    "SIM115",  # one-liner `open(p).read()` is a deliberate idiom in the tests
    "UP028",   # yield-in-for: the fake-session helpers read fine as-is
    "UP031",   # %-format is intentional in updater.py's batch-script quoting
]
